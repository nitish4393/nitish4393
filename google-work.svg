<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" width="900" height="288" role="img" aria-label="Google Trust and Safety Recent Projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131d36" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1324" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="900" height="288" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 6 6; animation: flow 1.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="288" fill="url(#bg)"/>
    <rect x="0.75" y="0.75" width="898.5" height="286.5" rx="15.5" fill="none" stroke="#818cf8" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- Section header bar -->
    <text x="24" y="30" class="mono" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="1">GOOGLE · TRUST &amp; SAFETY · RECENT PROJECTS (APR 2025 – PRESENT)</text>
    <line x1="24" y1="42" x2="876" y2="42" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>

    <!-- CARD 1: SQL + Python Pipeline -->
    <g transform="translate(24, 56)">
      <rect width="418" height="100" rx="12" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.24"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#bar1)"/>
      <text x="16" y="23" class="mono" font-size="10" font-weight="700" fill="#818cf8">01 · SQL + PYTHON PIPELINE</text>
      <rect x="310" y="10" width="94" height="18" rx="9" fill="#22d3ee" fill-opacity="0.14"/>
      <text x="357" y="22.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#67e8f9">8,000+ POLICIES</text>
      <text x="16" y="45" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Access-Governance Data Pipeline</text>
      <text x="16" y="65" class="sans" font-size="12" fill="#94a3b8">Foundational <tspan fill="#e2e8f0" font-weight="600">7-table</tspan> schema (fact + SCD Type 2 history), <tspan fill="#e2e8f0" font-weight="600">5</tspan> SQL</text>
      <text x="16" y="82" class="sans" font-size="12" fill="#94a3b8">extraction queries &amp; Python hash-based change detection.</text>
    </g>

    <!-- CARD 2: Ads Pre-Launch Dashboard -->
    <g transform="translate(458, 56)">
      <rect width="418" height="100" rx="12" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.24"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="url(#bar2)"/>
      <text x="16" y="23" class="mono" font-size="10" font-weight="700" fill="#34d399">02 · BI &amp; VISUALIZATION</text>
      <rect x="304" y="10" width="100" height="18" rx="9" fill="#10b981" fill-opacity="0.16"/>
      <text x="354" y="22.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#34d399">25–30 → 7–10d</text>
      <text x="16" y="45" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Google Ads Pre-Launch Policy Dashboard</text>
      <text x="16" y="65" class="sans" font-size="12" fill="#94a3b8">Official operational dashboard over issue-tracking data giving</text>
      <text x="16" y="82" class="sans" font-size="12" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">8 teams</tspan> live, owner-level visibility on critical P0/P1 SLAs.</text>
    </g>

    <!-- Animated connector lines between top & bottom rows -->
    <line x1="233" y1="156" x2="233" y2="170" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5" class="flow"/>
    <line x1="667" y1="156" x2="667" y2="170" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5" class="flow"/>

    <!-- CARD 3: LLM Auto-Evaluator Benchmark -->
    <g transform="translate(24, 170)">
      <rect width="418" height="100" rx="12" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.24"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="#22d3ee"/>
      <text x="16" y="23" class="mono" font-size="10" font-weight="700" fill="#22d3ee">03 · LLM &amp; STATISTICS</text>
      <rect x="296" y="10" width="108" height="18" rx="9" fill="#6366f1" fill-opacity="0.22"/>
      <text x="350" y="22.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#a5b4fc">~90% P · κ ~0.83</text>
      <text x="16" y="45" class="sans" font-size="15" font-weight="700" fill="#f8fafc">4-Model LLM Auto-Evaluator Benchmark</text>
      <text x="16" y="65" class="sans" font-size="12" fill="#94a3b8">Benchmarked <tspan fill="#e2e8f0" font-weight="600">4</tspan> models on <tspan fill="#e2e8f0" font-weight="600">~1,900</tspan> ad reviews &amp; <tspan fill="#e2e8f0" font-weight="600">6</tspan> policy areas</text>
      <text x="16" y="82" class="sans" font-size="12" fill="#94a3b8">against pass bars; selected winner (<tspan fill="#e2e8f0" font-weight="600">~93% recall</tspan> vs. experts).</text>
    </g>

    <!-- CARD 4: One-Step AI-Agent Workflow -->
    <g transform="translate(458, 170)">
      <rect width="418" height="100" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-opacity="0.34"/>
      <rect x="0" y="0" width="4" height="100" rx="2" fill="#fbbf24"/>
      <text x="16" y="23" class="mono" font-size="10" font-weight="700" fill="#fbbf24">04 · AI AGENTS · ★ SILVER GOOGLE AI AWARD</text>
      <rect x="304" y="10" width="100" height="18" rx="9" fill="#fbbf24" fill-opacity="0.16"/>
      <text x="354" y="22.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#fde68a">7–10d → 25–30m</text>
      <text x="16" y="45" class="sans" font-size="15" font-weight="700" fill="#f8fafc">One-Step AI-Agent Evaluation Workflow</text>
      <text x="16" y="65" class="sans" font-size="12" fill="#94a3b8">Enabled policy testers without production access to run</text>
      <text x="16" y="82" class="sans" font-size="12" fill="#94a3b8">evaluations independently inside an award-winning program.</text>
    </g>
  </g>
</svg>
